name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          for file in mimi-launch $(git ls-files '*.sh'); do bash -n "$file"; done
          node --check ecosystem.config.js
      # ubuntu-latest ships shellcheck; mimi-launch passes it at warning severity
      - name: ShellCheck
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck --version
            shellcheck -S warning mimi-launch $(git ls-files '*.sh')
          else
            echo "shellcheck is not installed on this runner: skipped"
          fi
      - name: Usage
        run: |
          set +e
          bash mimi-launch > "$RUNNER_TEMP/usage.txt"
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "mimi-launch update" "$RUNNER_TEMP/usage.txt"
